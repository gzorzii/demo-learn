spring.application.name=demo-learn
spring.profiles.active=dev
# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/demo_learn
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=false
# Liquibase
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
# Logging
logging.level.root=warn
logging.level.com.ciet.demo_learn=info
# Auth
app.jwt.secret=ZGVtby1sZWFybi1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LTI1Ng==
app.jwt.expiration-seconds=28800
app.cookie.secure=false
app.google.client-id=${GOOGLE_CLIENT_ID}
# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Storage
app.storage.upload-dir=uploads
